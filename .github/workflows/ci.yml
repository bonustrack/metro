name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metro_test
          POSTGRES_PASSWORD: metro_test
          POSTGRES_DB: metro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metro_test -d metro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Knip (unused files/deps/exports)
        run: bun run knip
      - name: Madge (circular dependencies)
        run: bun run madge
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test
        env:
          TEST_DATABASE_URL: postgresql://metro_test:metro_test@127.0.0.1:5432/metro_test
