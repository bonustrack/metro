name: Deploy gateway.metro.box

# FLY_GATEWAY_API_TOKEN is a deploy token for the metro-gateway app only
# (fly tokens create deploy -a metro-gateway); FLY_API_TOKEN cannot deploy this app.
on:
  push:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - 'packages/inference/**'
      - 'packages/connectors/**'
      - 'packages/http/**'
      - 'packages/core/**'
      - 'bun.lock'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Test
        run: bun --filter @metro-labs/inference --filter @metro-labs/gateway test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy . --config apps/gateway/fly.toml --dockerfile apps/gateway/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_GATEWAY_API_TOKEN }}
