name = "metro-bundler"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# bundler.metro.box/<branch>: the dev client gets that branch's latest EAS
# Update manifest (channel = the branch name, escaped like
# scripts/app/channel-key.mjs), a browser gets the preview launcher
# (apps/app/public/preview-launcher.html, bundled in as text). The Worker
# answers everything itself, so it is a Custom Domain: the deploy creates the
# DNS record and the certificate in the metro.box zone.
routes = [
  { pattern = "bundler.metro.box", custom_domain = true },
]
