<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Metro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: light)" />
    <style id="expo-reset">
      html {
        background: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0e0f10;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      *:focus:not(:focus-visible) {
        outline: none;
      }
      input,
      textarea {
        outline: none;
      }
      @media (pointer: coarse) {
        * {
          scrollbar-width: none;
        }
        *::-webkit-scrollbar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Metro needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
