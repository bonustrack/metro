# Fly.io deployment for metro.
#
# ONE always-on machine + a single-attach volume. The volume can attach to only one
# machine, which ENFORCES XMTP's single-writer rule for free; disk-backed deploys
# replace the machine in place (the old one stops before the new starts), so there is
# never a moment with two writers on the same inbox.
#
# Change `app` to your own unique name (or run `fly launch` to generate one).

app = "metro"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Schema migrations run HERE, not at boot. Fly runs this in a temporary machine with the
# app's secrets BEFORE the new version is released: a non-zero exit ABORTS the deploy and
# the old machine keeps serving, so a bad migration can never crash-loop the daemon.
#
# release_command replaces CMD but NEVER overrides ENTRYPOINT — which is why the Dockerfile
# uses CMD. With an ENTRYPOINT the release machine would run the daemon instead, never exit,
# and time the deploy out.
#
# `bun --filter` sets cwd to apps/api so drizzle.config.ts's relative `out` resolves; that is
# also why drizzle-kit is a runtime dependency, not a devDependency.
[deploy]
  release_command = "bun --filter @metro-labs/api db:migrate"

[env]
  HOME = "/data"
  METRO_HTTP_HOST = "0.0.0.0"
  METRO_LOG_LEVEL = "info"
  # HOME=/data puts the durable state on the mounted volume:
  #   XMTP MLS db3s  → /data/.metro/xmtp-production-<id>.db3  (MUST persist)
  #   state dir      → /data/.cache/metro  (METRO_STATE_DIR default: lock, IPC)

# Secrets are NOT stored here — set them with `fly secrets set` (see README "Deploying"):
#   DATABASE_URL  (required — the Postgres holding the sealed vaults and the server lists)
#   To have metro issue servers, five more (docs/ISSUING-SERVERS.md), and with any of
#   them unset the feature is simply off: METRO_AWS_ACCESS_KEY_ID,
#   METRO_AWS_SECRET_ACCESS_KEY, METRO_LAUNCH_TAILNET, METRO_TAILSCALE_AUTH_KEY,
#   METRO_LAUNCH_OWNERS (the wallets allowed to ask), plus optional METRO_LAUNCH_MAX.
# This app runs no station and holds no station credential: a vault row is ciphertext
# sealed in the browser, and nothing here can open one.

[http_service]
  internal_port = 8420
  force_https = true
  # ALWAYS-ON: metro holds XMTP streams + Telegram long-poll; never let Fly stop the
  # machine, and never run more than one (single-writer).
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"

# The single-attach volume holds the durable XMTP MLS db3s (see [env] above). Losing
# it burns 1 of the inbox's 10 install slots, so it MUST stay mounted at /data.
[mounts]
  source = "metro_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # bump (2gb+) as you add XMTP accounts — each is a live client
